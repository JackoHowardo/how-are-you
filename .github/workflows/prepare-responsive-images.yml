name: Prepare responsive portfolio images
on:
  push:
    branches: [codex/site-polish-assets-20261001]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install image encoder
        run: python -m pip install Pillow==12.0.0
      - name: Generate and validate images
        run: python .asset-build/build.py
      - name: Save assets on the preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/
          git commit -m 'Generate responsive portfolio image assets'
          git push origin HEAD:codex/site-polish-assets-20261001
